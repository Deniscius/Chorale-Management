# Démonstration uniquement : aucune ressource payante dans ce Blueprint.
services:
  - type: web
    name: chorale-demo
    runtime: docker
    region: frankfurt
    plan: free
    autoDeployTrigger: 'off'
    healthCheckPath: /up
    envVars:
      - {key: APP_NAME, value: Chorale Management - Démo}
      - {key: APP_ENV, value: production}
      - {key: APP_DEBUG, value: 'false'}
      - {key: APP_DEMO_MODE, value: 'true'}
      - {key: RUN_MIGRATIONS_ON_START, value: 'true'}
      - {key: APP_KEY, generateValue: true}
      - {key: APP_URL, sync: false}
      - {key: TRUSTED_PROXIES, sync: false}
      - {key: PLATFORM_BOOTSTRAP_EMAIL, sync: false}
      - {key: PLATFORM_BOOTSTRAP_PASSWORD, sync: false}
      - {key: PLATFORM_BOOTSTRAP_TOTP_SECRET, sync: false}
      - key: DB_URL
        fromDatabase: {name: chorale-demo-postgres, property: connectionString}
      - {key: DB_CONNECTION, value: pgsql}
      - {key: DB_SSLMODE, value: require}
      - {key: CACHE_STORE, value: database}
      - {key: SESSION_DRIVER, value: database}
      - {key: SESSION_SECURE_COOKIE, value: 'true'}
      - {key: SESSION_SAME_SITE, value: lax}
      - {key: QUEUE_CONNECTION, value: sync}
      - {key: LOG_CHANNEL, value: stderr}
      - {key: MAIL_MAILER, value: log}
      - {key: TENANCY_ENABLED, value: 'true'}
      - {key: TENANT_REGISTRATION_ENABLED, value: 'true'}
      - {key: REMINDERS_ENABLED, value: 'false'}
      - {key: REMINDERS_SMS_ENABLED, value: 'false'}
      - {key: AI_ENABLED, value: 'false'}
      - {key: CHARIOW_PAYMENT_URL, value: ''}
      - {key: CHARIOW_API_KEY, value: ''}
      - {key: CHARIOW_PRODUCT_ID, value: ''}
databases:
  - name: chorale-demo-postgres
    region: frankfurt
    plan: free
    postgresMajorVersion: '17'
    databaseName: chorale_demo
    user: chorale
    ipAllowList: []
