<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
ServerTokens Prod
ServerSignature Off
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 2
    MaxSpareServers 6
    # The service receives concurrent Livewire updates. Keep a modest headroom
    # on the free instance while avoiding an unsafe number of PHP processes.
    MaxRequestWorkers 16
    MaxConnectionsPerChild 750
</IfModule>
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 2
Timeout 30
