name: Render container
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: render-container-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Blueprint structure
        run: |
          python -m pip install pyyaml jsonschema
          python - <<'PY'
          import json, urllib.request, yaml, jsonschema
          schema = json.load(urllib.request.urlopen('https://render.com/schema/render.yaml.json'))
          for path in ['render.yaml', 'deploy/render.production.yaml']:
              jsonschema.validate(yaml.safe_load(open(path)), schema)
          PY
      - name: Check read-only migration manifest tooling
        run: python -B -m unittest discover -s tests/deployment -v
      - name: Build production image
        run: docker build -t chorale-production .
      - name: Start disposable PostgreSQL
        run: |
          docker network create chorale-ci
          docker run -d --name postgres --network chorale-ci -e POSTGRES_DB=chorale_ci -e POSTGRES_USER=chorale -e POSTGRES_PASSWORD=ci-only postgres:17
          for attempt in $(seq 1 30); do docker exec postgres pg_isready -U chorale -d chorale_ci && break; sleep 2; done
      - name: Check release, production defaults, and HTTP
        run: |
          cat > /tmp/chorale-ci.env <<EOF
          APP_ENV=production
          APP_DEBUG=false
          APP_KEY=$(openssl rand -base64 32)
          APP_URL=http://localhost:10000
          DB_CONNECTION=pgsql
          DB_URL=postgresql://chorale:ci-only@postgres:5432/chorale_ci
          DB_SSLMODE=disable
          PRIVATE_FILES_DRIVER=database
          CACHE_STORE=database
          SESSION_DRIVER=database
          QUEUE_CONNECTION=database
          LOG_CHANNEL=stderr
          MAIL_MAILER=log
          EOF
          docker run --rm --network chorale-ci --env-file /tmp/chorale-ci.env chorale-production sh docker/release.sh
          docker run --rm --network chorale-ci --env-file /tmp/chorale-ci.env chorale-production sh docker/release.sh
          test "$(docker exec postgres psql -U chorale -d chorale_ci -tAc 'SELECT count(*) FROM users')" = '0'
          test "$(docker exec postgres psql -U chorale -d chorale_ci -tAc 'SELECT count(*) FROM members')" = '0'
          docker run -d --name web --network chorale-ci --env-file /tmp/chorale-ci.env -p 10000:10000 chorale-production
          for attempt in $(seq 1 30); do curl --fail --silent http://localhost:10000/up && break; sleep 2; done
          curl --fail --silent http://localhost:10000/up > /dev/null
          curl --fail --silent http://localhost:10000/login > /dev/null
          docker run --rm --network chorale-ci --env-file /tmp/chorale-ci.env chorale-production schedule
          docker run --rm --network chorale-ci --env-file /tmp/chorale-ci.env chorale-production php artisan queue:work database --once --stop-when-empty
      - name: Check first owner installation without demo branding
        run: |
          docker run -d --name hosted --network chorale-ci --env-file /tmp/chorale-ci.env -p 10001:10000 \
            -e APP_DEMO_MODE=false -e RUN_MIGRATIONS_ON_START=true \
            -e CI_STORAGE_TEST=1 -e PLATFORM_BOOTSTRAP_ENABLED=true \
            -e PLATFORM_SETUP_TOKEN=CIOnlyPrivateInstallationTokenWithAtLeast32Characters \
            chorale-production
          for attempt in $(seq 1 30); do curl --fail --silent http://localhost:10001/up && break; sleep 2; done
          curl --fail --silent http://localhost:10001/login > /tmp/public-login.html
          ! grep -q 'Démonstration gratuite.' /tmp/public-login.html
          curl --fail --silent -c /tmp/owner.cookies http://localhost:10001/plateforme/installation > /tmp/owner-form.html
          csrf=$(python -c 'import re; print(re.search(r"name=\"_token\" value=\"([^\"]+)\"", open("/tmp/owner-form.html").read()).group(1))')
          secret=$(python -c 'import re; print(re.search(r"<code[^>]*>([A-Z2-7]{32})</code>", open("/tmp/owner-form.html").read()).group(1))')
          code=$(docker exec hosted php -r 'require "vendor/autoload.php"; $app=require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); echo app(App\Services\Platform\Totp::class)->code($argv[1], intdiv(time(), 30));' "$secret")
          test "$(curl --silent -o /tmp/setup-result.html -w '%{http_code}' -b /tmp/owner.cookies -X POST http://localhost:10001/plateforme/installation \
            --data-urlencode "_token=$csrf" --data-urlencode setup_token=CIOnlyPrivateInstallationTokenWithAtLeast32Characters \
            --data-urlencode name=Owner --data-urlencode email=owner@example.test \
            --data-urlencode password=TestOnlyOwnerSecret2026 --data-urlencode password_confirmation=TestOnlyOwnerSecret2026 \
            --data-urlencode "code=$code")" = '302'
          test "$(docker exec postgres psql -U chorale -d chorale_ci -tAc 'SELECT count(*) FROM platform_admins')" = '1'
          docker exec hosted php docker/verify-private-storage.php write
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://localhost:10001/c/espace-existant/logo)" = '302'
          docker exec hosted php docker/verify-private-storage.php fingerprint > /tmp/logo-before.sha256
          docker rm -f hosted
          docker run -d --name hosted --network chorale-ci --env-file /tmp/chorale-ci.env -p 10001:10000 \
            -e APP_DEMO_MODE=false -e RUN_MIGRATIONS_ON_START=true \
            -e CI_STORAGE_TEST=1 -e PLATFORM_BOOTSTRAP_ENABLED=true \
            -e PLATFORM_SETUP_TOKEN=CIOnlyPrivateInstallationTokenWithAtLeast32Characters \
            chorale-production
          for attempt in $(seq 1 30); do curl --fail --silent http://localhost:10001/up && break; sleep 2; done
          curl --fail --silent http://localhost:10001/up > /dev/null
          test "$(docker exec postgres psql -U chorale -d chorale_ci -tAc 'SELECT count(*) FROM platform_admins')" = '1'
          docker exec hosted php docker/verify-private-storage.php verify
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://localhost:10001/c/espace-existant/logo)" = '302'
          docker exec hosted php docker/verify-private-storage.php fingerprint > /tmp/logo-after.sha256
          cmp /tmp/logo-before.sha256 /tmp/logo-after.sha256
      - name: Logs on failure
        if: failure()
        run: |
          docker logs web 2>/dev/null || true
          docker logs hosted 2>/dev/null || true
