# Web conservé sur Render ; base externe Neon configurée manuellement après validation.
# Ne pas synchroniser avant la procédure docs/MIGRATION-NEON.md.
services:
  - type: web
    name: chorale-management
    runtime: docker
    region: frankfurt
    plan: free
    autoDeployTrigger: 'off'
    healthCheckPath: /up
    envVars:
      - {key: APP_NAME, value: Chorale Management}
      - {key: APP_ENV, value: production}
      - {key: APP_DEBUG, value: 'false'}
      - {key: APP_DEMO_MODE, value: 'false'}
      - {key: APP_CANONICAL_HTTPS, value: 'true'}
      - {key: PLATFORM_BOOTSTRAP_ENABLED, value: 'true'}
      - {key: PLATFORM_SETUP_TOKEN, generateValue: true}
      - {key: FILES_EPHEMERAL, value: 'true'}
      - {key: DATABASE_FREE_PLAN, value: 'false'}
      - {key: RUN_MIGRATIONS_ON_START, value: 'true'}
      - key: APP_KEY
        fromService: {type: web, name: chorale-initial, envVarKey: APP_KEY}
      - key: APP_URL
        fromService: {type: web, name: chorale-management, envVarKey: RENDER_EXTERNAL_URL}
      - {key: TRUSTED_PROXIES, value: ''}
      - key: DB_URL
        sync: false
      - key: WEBPUSH_PUBLIC_KEY
        sync: false
      - key: WEBPUSH_PRIVATE_KEY
        sync: false
      - key: WEBPUSH_SUBJECT
        sync: false
      - {key: DB_CONNECTION, value: pgsql}
      - {key: DB_SSLMODE, value: verify-full}
      - {key: DB_SSLROOTCERT, value: /etc/ssl/certs/ca-certificates.crt}
      - {key: CACHE_STORE, value: database}
      - {key: SESSION_DRIVER, value: database}
      - {key: SESSION_ENCRYPT, value: 'true'}
      - {key: SESSION_SECURE_COOKIE, value: 'true'}
      - {key: SESSION_SAME_SITE, value: lax}
      - {key: QUEUE_CONNECTION, value: sync}
      - {key: LOG_CHANNEL, value: stderr}
      # Brevo is configured without enabling delivery by default.
      # Render Free blocks SMTP 25/465/587; Brevo supports STARTTLS on 2525.
      # Enable MAIL_DELIVERY_ENABLED only after sender verification and a test.
      - {key: MAIL_MAILER, value: log}
      - {key: MAIL_DELIVERY_ENABLED, value: 'false'}
      - {key: MAIL_HOST, value: smtp-relay.brevo.com}
      - {key: MAIL_PORT, value: '2525'}
      - {key: MAIL_FROM_NAME, value: Chorale Management}
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - {key: TENANCY_ENABLED, value: 'true'}
      - {key: CHURCH_PROJECT_INTEGRATION_ENABLED, value: 'false'}
      - {key: TENANT_REGISTRATION_ENABLED, value: 'true'}
      - {key: REMINDERS_ENABLED, value: 'true'}
      # Le service web actuellement déployé n'a pas de worker associé : les
      # rappels doivent être envoyés pendant le passage du planificateur.
      - {key: REMINDERS_QUEUED, value: 'false'}
      - {key: REMINDERS_PLATFORM_DAYS, value: '7,2,0'}
      - {key: PERSONAL_NOTEBOOK_DAYS, value: '45'}
      - {key: REMINDERS_SMS_ENABLED, value: 'false'}
      - {key: AI_ENABLED, value: 'false'}
