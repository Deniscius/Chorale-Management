# Offre gratuite : ancien web renommé chorale-initial ; nouvelle adresse, même base et même clé.
services:
  - type: web
    name: chorale-management
    runtime: docker
    region: frankfurt
    plan: free
    autoDeployTrigger: 'off'
    healthCheckPath: /up
    envVars:
      - {key: APP_NAME, value: Chorale Management}
      - {key: APP_ENV, value: production}
      - {key: APP_DEBUG, value: 'false'}
      - {key: APP_DEMO_MODE, value: 'false'}
      - {key: APP_CANONICAL_HTTPS, value: 'true'}
      - {key: PLATFORM_BOOTSTRAP_ENABLED, value: 'true'}
      - {key: PLATFORM_SETUP_TOKEN, generateValue: true}
      - {key: FILES_EPHEMERAL, value: 'true'}
      - {key: DATABASE_FREE_PLAN, value: 'true'}
      - {key: RUN_MIGRATIONS_ON_START, value: 'true'}
      - key: APP_KEY
        fromService: {type: web, name: chorale-initial, envVarKey: APP_KEY}
      - key: APP_URL
        fromService: {type: web, name: chorale-management, envVarKey: RENDER_EXTERNAL_URL}
      - {key: TRUSTED_PROXIES, value: ''}
      - key: DB_URL
        fromDatabase: {name: chorale-demo-postgres, property: connectionString}
      - {key: DB_CONNECTION, value: pgsql}
      - {key: DB_SSLMODE, value: require}
      - {key: CACHE_STORE, value: database}
      - {key: SESSION_DRIVER, value: database}
      - {key: SESSION_SECURE_COOKIE, value: 'true'}
      - {key: SESSION_SAME_SITE, value: lax}
      - {key: QUEUE_CONNECTION, value: sync}
      - {key: LOG_CHANNEL, value: stderr}
      - {key: MAIL_MAILER, value: log}
      - {key: TENANCY_ENABLED, value: 'true'}
      - {key: TENANT_REGISTRATION_ENABLED, value: 'true'}
      - {key: REMINDERS_ENABLED, value: 'false'}
      - {key: REMINDERS_SMS_ENABLED, value: 'false'}
      - {key: AI_ENABLED, value: 'false'}
databases:
  - name: chorale-demo-postgres
    region: frankfurt
    plan: free
    postgresMajorVersion: '17'
    databaseName: chorale_demo
    user: chorale
    ipAllowList: []
