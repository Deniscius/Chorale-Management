name: Qualité
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: chorale_test
          POSTGRES_USER: chorale_test
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chorale_test -d chorale_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      DB_CONNECTION: ${{ matrix.database }}
      DB_DATABASE: ${{ matrix.database == 'sqlite' && ':memory:' || 'chorale_test' }}
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: chorale_test
      DB_PASSWORD: test-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, pdo_pgsql
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci && npm audit --audit-level=moderate && npm run build
      - run: php vendor/phpunit/phpunit/phpunit
      - run: composer audit
      - run: php vendor/bin/pint --test app/Services/ReceiptLedger.php app/Services/ReferenceSequence.php app/Services/TransactionWriter.php app/Support/CalendarYears.php tests/Feature/PostgreSqlAndLedgerTest.php
